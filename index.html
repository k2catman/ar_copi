<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8th Wall Image Target AR</title>

  <script src="https://cdn.8thwall.com/web/aframe/8frame.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="https://cdn.8thwall.com/web/three/three.min.js"></script>
  <script src="https://cdn.8thwall.com/web/three/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    xrweb="allowedDevices: any;"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    embedded
  >

    <!-- 顕微鏡マーカー -->
    <a-entity image-target="src: ./assets/pattern-zeiss-marker.png;">
      <a-entity gltf-model="./assets/zeiss.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-entity>

    <!-- 人工心肺マーカー -->
    <a-entity image-target="src: ./assets/pattern-heartlung-marker.png;">
      <a-entity gltf-model="./assets/heartlung.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
